<style>
  :root{
    --navy:#0F1B2D;
    --navy-2:#16273D;
    --slate:#24405C;
    --gold:#C9A227;
    --gold-soft:#E4C868;
    --off:#F5F3EE;
    --off-2:#EDEAE1;
    --ink:#0F1B2D;
    --muted:#6B7686;
    --green:#2F9E44;
    --red:#D64545;

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{

  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

  .stat-label{font-size:12px;color:var(--muted);margin-top:3px;}

<script>
// ============ Persistent storage (IndexedDB with localStorage fallback) ============
const DB_NAME = 'ojwinUPVC';
const STORE_NAME = 'store';
const RECORD_KEY = 'main';

function openIDB(){
  return new Promise((resolve, reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('no-idb')); return; }
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore(STORE_NAME);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbGet(){
  const db = await openIDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).get(RECORD_KEY);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSet(value){
  const db = await openIDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(value, RECORD_KEY);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
  });
}
async function loadData(){
  let rec = null;
  try{
    rec = await idbGet();
  }catch(e){}
  if(!rec){
    try{
      const raw = localStorage.getItem('ojwinUPVC_fallback');
      if(raw) rec = JSON.parse(raw);
    }catch(e){}
  }
  const merged = Object.assign(emptyData(), rec||{});
  if(!rec || rec.projects===undefined){
    merged.projects = buildSeedProjects();
  }
  if(!rec || rec.companyInfo===undefined || rec.companyInfo===null){
    merged.companyInfo = defaultCompanyInfo();
  }
  if(!rec || rec.quotes===undefined){
    merged.quotes = [];
  }
  return merged;
}

// تبدیل تاریخ میلادی به شمسی (الگوریتم استاندارد jalaali)
function toJalali(gy, gm, gd){
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = 355666 + (365 * gy) + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) + Math.floor((gy2 + 399) / 400) + gd + g_d_m[gm - 1];
  let jy = -1595 + (33 * Math.floor(days / 12053));
  days %= 12053;
  jy += 4 * Math.floor(days / 1461);
  days %= 1461;
  let jm, jd;
  if (days > 365) { jy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
  if (days < 186) { jm = 1 + Math.floor(days / 31); jd = 1 + (days % 31); }
  else { jm = 7 + Math.floor((days - 186) / 30); jd = 1 + ((days - 186) % 30); }
  return [jy, jm, jd];
}
function todayJalaliStr(){
  const d = new Date();
  const [jy,jm,jd] = toJalali(d.getFullYear(), d.getMonth()+1, d.getDate());
  const p = n => String(n).padStart(2,'0');
  return jy + '/' + p(jm) + '/' + p(jd);
}

function normalizePhoneForWhatsapp(phone){
  if(!phone) return null;
  let p = phone.replace(/[^0-9+]/g,'');
  if(p.startsWith('0')) p = '98' + p.slice(1);
  else if(p.startsWith('+')) p = p.slice(1);
  return p || null;
}

// ============ Image compression ============
function compressImage(file, maxW=900, quality=0.6){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxW){ h = h*(maxW/w); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function overdueCustomers(){
  return data.customers.filter(c=> c.nextFollowup && c.nextFollowup <= todayISO() && c.status !== 'تحویل');
}
function checkBrowserReminders(){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  let changed = false;
  const today = todayISO();
  overdueCustomers().forEach(c=>{
    if(c.lastNotified !== today){
      try{ new Notification('یادآوری پیگیری - اوج وین', {body: c.name + ' نیاز به پیگیری دارد', icon:'icon-192.png'}); }catch(e){}
      c.lastNotified = today;
      changed = true;
    }
  });
  if(changed) saveData();
}

let sigCtx=null, sigDrawing=false, sigHasData=false;
function setupSigPad(existing){
  const canvas = document.getElementById('sigPad');
  if(!canvas) return;
  canvas.width = canvas.offsetWidth; canvas.height = 150;
  sigCtx = canvas.getContext('2d');
  sigCtx.lineWidth = 2.2; sigCtx.lineCap='round'; sigCtx.strokeStyle='#0F1B2D';
  sigHasData = false;
  if(existing){
    const img = new Image();
    img.onload = ()=> sigCtx.drawImage(img,0,0,canvas.width,canvas.height);
    img.src = existing;
    sigHasData = true;
  }
  function pos(e){ const r=canvas.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left, y:t.clientY-r.top}; }
  function start(e){ sigDrawing=true; const p=pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x,p.y); e.preventDefault(); }
  function move(e){ if(!sigDrawing) return; const p=pos(e); sigCtx.lineTo(p.x,p.y); sigCtx.stroke(); sigHasData=true; e.preventDefault(); }
  function end(){ sigDrawing=false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
}
function clearSig(){
  const canvas = document.getElementById('sigPad');
  sigCtx.clearRect(0,0,canvas.width,canvas.height);
  sigHasData = false;
}

function openProjectImport(){
  openSheet(`
    <h3>وارد کردن لیست پروژه‌ها</h3>
    <p style="font-size:12px;color:var(--muted);line-height:1.9;margin:0 0 12px;">

    </p>
    <div class="field"><textarea id="importText" rows="8" placeholder="مثال: 09151234567 نام کارفرما سفت کاری 6 آدرس پروژه ..."></textarea></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="doImportBtn">شروع وارد کردن</button>
      <button class="btn btn-ghost" id="cancelImportBtn">انصراف</button>
    </div>
  `);
  document.getElementById('cancelImportBtn').addEventListener('click', closeSheet);
  document.getElementById('doImportBtn').addEventListener('click', async ()=>{
    const text = document.getElementById('importText').value;
    const {added, duplicates, unparsed} = importProjectsFromText(text);
    await saveData(); closeSheet(); render();
    alert(`نتیجه وارد کردن:\n${added} پروژه جدید اضافه شد\n${duplicates} مورد به دلیل شماره تکراری رد شد${unparsed?`\n${unparsed} خط قابل تشخیص نبود`:''}`);
  });
}
function importProjectsFromText(text){
  const STAGE_LIST = ['فندانسیون','سفت کاری','سفتکاری','نازک کاری','خاک گچ','اسکلت','نما'];
  const lines = (text||'').split(/\r?\n/);
  let added = 0, duplicates = 0, unparsed = 0;
  const seenNow = new Set(data.projects.map(p=>p.phone).filter(Boolean));
  lines.forEach(raw=>{
    let l = raw.trim();
    if(!l) return;
    let m = l.match(/^(09\d{9})\s+(.*)$/);
    if(!m){
      // شاید متن به‌صورت آینه‌ای (راست‌به‌چپ خام) استخراج شده باشد؛ کل خط را برعکس می‌کنیم
      // و فقط رشته‌های عددی را به حالت درست برمی‌گردانیم
      const reversed = l.split('').reverse().join('').replace(/\d+/g, d=> d.split('').reverse().join(''));
      m = reversed.match(/^(09\d{9})\s+(.*)$/);
    }
    if(!m){ unparsed++; return; }
    const phone = m[1];
    let rest = m[2];
    if(seenNow.has(phone)){ duplicates++; return; }
    let stageFound = '', idx = -1;
    STAGE_LIST.forEach(s=>{
      const pos = rest.indexOf(s);
      if(pos!==-1 && (idx===-1 || pos<idx)){ stageFound = s; idx = pos; }
    });
    let name, floors='', address='';
    if(stageFound){
      name = rest.slice(0, idx).trim();
      const after = rest.slice(idx+stageFound.length).trim();
      const m2 = after.match(/^(\d+)\s*(.*)$/);
      if(m2){ floors = m2[1]; address = m2[2].trim(); }
      else address = after;
    } else {
      name = rest.trim();
    }
    if(stageFound==='سفتکاری') stageFound = 'سفت کاری';
    if(!name) name = '—';
    data.projects.push({id:uid(), createdAt:todayISO(), name, phone, stage:stageFound, floors, address});
    seenNow.add(phone);
    added++;
  });
  return {added, duplicates, unparsed};
}

function openQuoteForm(id){
  const q = id ? data.quotes.find(x=>x.id===id) : null;

  quoteFormItems = q ? JSON.parse(JSON.stringify(q.items||[])) : [{desc:'',dims:'',specs:'',unitPrice:'',totalPrice:''}];
  openSheet(`

    <div class="field"><label>تاریخ تحویل</label><input id="f_qdelivery" value="${q?q.deliveryDate||'':''}"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="saveQuote">${q?'ذخیره تغییرات':'ساخت پیش‌فاکتور'}</button>
      ${q?'<button class="btn btn-danger" id="delQuote">حذف</button>':''}
    </div>
  `);
  renderQuoteItemRows();
  document.getElementById('addRowBtn').addEventListener('click', ()=>{
    quoteFormItems.push({desc:'',dims:'',specs:'',unitPrice:'',totalPrice:''});
    renderQuoteItemRows();
  });
  document.getElementById('saveQuote').addEventListener('click', async ()=>{
    const customerName = document.getElementById('f_qcustomer').value.trim();
    if(!customerName){ alert('نام مشتری الزامیه'); return; }
    const items = quoteFormItems.filter(it=> (it.desc||'').trim());
    if(!items.length){ alert('حداقل یک ردیف کالا وارد کن'); return; }
    const total = items.reduce((s,it)=> s + (Number(it.totalPrice)||0), 0);
    const number = document.getElementById('f_qnumber').value.trim();
    const payload = {
      number,
      date: document.getElementById('f_qdate').value.trim(),
      customerName,
      subject: document.getElementById('f_qsubject').value.trim(),
      items, total,
      note: document.getElementById('f_qnote').value.trim(),
      deliveryDate: document.getElementById('f_qdelivery').value.trim()
    };
    let savedId;
    if(q){ Object.assign(q, payload); savedId = q.id; }
    else {
      const newQ = {id:uid(), createdAt:todayISO(), ...payload};
      data.quotes.push(newQ); savedId = newQ.id;
      const asNum = Number(number);
      if(asNum){ data.companyInfo = Object.assign({}, c, {nextQuoteNumber: asNum+1}); }
    }
    await saveData(); closeSheet(); render();
    openQuotePreview(savedId);
  });
  if(q){ document.getElementById('delQuote').addEventListener('click', async ()=>{
    if(!confirm('حذف این پیش‌فاکتور؟')) return;
    data.quotes = data.quotes.filter(x=>x.id!==q.id);
    await saveData(); closeSheet(); render();
  });}
}

function loadHtml2Canvas(){
  return new Promise((resolve, reject)=>{
    if(window.html2canvas){ resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload = ()=> resolve();
    s.onerror = ()=> reject(new Error('load-fail'));
    document.head.appendChild(s);
  });
}
async function exportQuoteAsJPG(q){
  const btn = document.getElementById('exportQuoteBtn');
  const originalText = btn ? btn.textContent : '';
  try{
    if(btn){ btn.textContent = 'در حال ساخت تصویر...'; btn.disabled = true; }
    await loadHtml2Canvas();
    const node = document.getElementById('quoteRenderTarget');
    const canvas = await window.html2canvas(node, {scale:2, backgroundColor:'#ffffff', useCORS:true});
    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
    let shared = false;
    if(navigator.canShare){
      try{
        const blob = await (await fetch(dataUrl)).blob();
        const file = new File([blob], 'pishfaktor-'+q.number+'.jpg', {type:'image/jpeg'});
        if(navigator.canShare({files:[file]})){
          await navigator.share({files:[file], title:'پیش‌فاکتور '+q.number});
          shared = true;
        }
      }catch(e){}
    }
    if(!shared){
      const a = document.createElement('a');
      a.href = dataUrl; a.download = 'pishfaktor-'+q.number+'.jpg';
      document.body.appendChild(a); a.click(); a.remove();
    }
  }catch(e){
    alert('ساخت تصویر با خطا مواجه شد. برای اولین بار به اتصال اینترنت نیاز است.');
  } finally {
    if(btn){ btn.textContent = originalText; btn.disabled = false; }
  }
}

      <div class="btn-row">
        <button class="btn copy-btn" data-copy="${r.id}">📋 کپی پاسخ</button>
        <button class="btn btn-ghost" data-edit-reply="${r.id}">ویرایش</button>
      </div>
    </div>
  `).join('');
  list.querySelectorAll('[data-edit-reply]').forEach(b=> b.addEventListener('click', ()=> openReplyForm(b.dataset.editReply)));
  list.querySelectorAll('[data-copy]').forEach(b=> b.addEventListener('click', ()=>{
    const r = data.replies.find(x=>x.id===b.dataset.copy);
    navigator.clipboard.writeText(r.answer)
      .then(()=> alert('پاسخ کپی شد! حالا توی واتساپ یا اینستاگرام پیست کن.'))
      .catch(()=> alert('کپی خودکار پشتیبانی نشد؛ متن را دستی انتخاب کن.'));
  }));
}
function openReplyForm(id){
  const r = id ? data.replies.find(x=>x.id===id) : null;
  openSheet(`
    <h3>${r?'ویرایش پاسخ آماده':'پاسخ آماده جدید'}</h3>
    <div class="field"><label>عنوان سوال متداول</label><input id="f_rq" value="${r?r.question:''}" placeholder="مثلاً: هزینه پنجره دوجداره چقدره؟"></div>
    <div class="field"><label>متن پاسخ آماده</label><textarea id="f_ra" style="min-height:110px;">${r?r.answer:''}</textarea></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="saveReply">${r?'ذخیره تغییرات':'افزودن پاسخ'}</button>
      ${r?'<button class="btn btn-danger" id="delReply">حذف</button>':''}
    </div>
  `);
  document.getElementById('saveReply').addEventListener('click', async ()=>{
    const question = document.getElementById('f_rq').value.trim();
    if(!question){ alert('عنوان سوال الزامیه'); return; }
    const answer = document.getElementById('f_ra').value.trim();
    if(r){ Object.assign(r, {question, answer}); }
    else { data.replies.push({id:uid(), question, answer}); }
    await saveData(); closeSheet(); render();
  });
  if(r){ document.getElementById('delReply').addEventListener('click', async ()=>{
    if(!confirm('حذف این پاسخ؟')) return;
    data.replies = data.replies.filter(x=>x.id!==r.id);
    await saveData(); closeSheet(); render();
  });}
}

  const totalOverdue = data.invoices.filter(i=>i.status==='معوق').length;
  const avgOrder = data.invoices.length ? Math.round(totalInvoiced/data.invoices.length) : 0;
  const delivered = data.customers.filter(c=>c.status==='تحویل').length;
  const conv = data.customers.length ? Math.round((delivered/data.customers.length)*100) : 0;

  main.innerHTML = `
    <div class="section-title">فروش ۶ ماه اخیر</div>
    <canvas id="lineChart" height="150"></canvas>
    <div class="section-title" style="margin-top:20px;">تعداد سفارش‌ها بر اساس مرحله</div>
    <canvas id="barChart" height="170"></canvas>
    <div class="section-title" style="margin-top:20px;">خلاصه عملکرد</div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-num">${fmtMoney(totalInvoiced)}</div><div class="stat-label">مجموع فاکتورشده</div><div class="stat-accent"></div></div>
      <div class="stat-card"><div class="stat-num">${totalOverdue}</div><div class="stat-label">فاکتورهای معوق</div><div class="stat-accent"></div></div>
      <div class="stat-card"><div class="stat-num">${conv}%</div><div class="stat-label">نرخ تبدیل به تحویل</div><div class="stat-accent"></div></div>
      <div class="stat-card"><div class="stat-num">${fmtMoney(avgOrder)}</div><div class="stat-label">میانگین ارزش فاکتور</div><div class="stat-accent"></div></div>
    </div>
  `;
  const months = [];
  for(let i=5;i>=0;i--){ const d=new Date(); d.setMonth(d.getMonth()-i); months.push(d); }
  const monthLabels = months.map(d=>fmtMonthShort(d.toISOString()));
  const monthValues = months.map(md=>{
    return data.invoices.filter(inv=>{
      const dd = new Date(inv.createdAt||Date.now());
      return dd.getFullYear()===md.getFullYear() && dd.getMonth()===md.getMonth();
    }).reduce((s,inv)=>s+Number(inv.total||0),0);
  });
  drawLineChart('lineChart', monthLabels, monthValues, '#C9A227');
  const stageCounts = ORDER_STAGES.map(s=> data.orders.filter(o=>o.stage===s).length);
  drawBarChart('barChart', ORDER_STAGES_SHORT, stageCounts, '#24405C');
}
function setupCanvas(id, cssHeight){
  const canvas = document.getElementById(id);
  const dpr = window.devicePixelRatio || 1;
  const cssWidth = canvas.parentElement.clientWidth - 18;
  canvas.width = cssWidth*dpr; canvas.height = cssHeight*dpr;
  canvas.style.width = cssWidth+'px'; canvas.style.height = cssHeight+'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,cssWidth,cssHeight);
  return {ctx, w:cssWidth, h:cssHeight};
}
function roundRectFill(ctx,x,y,w,h,r){
  if(h<=0.5) return;
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
  ctx.fill();
}
function drawBarChart(id, labels, values, color){
  const {ctx,w,h} = setupCanvas(id, 170);
  const max = Math.max(...values, 1);
  const padding = 10, bottomPad = 30;
  const chartH = h - bottomPad - 14;
  const gap = 8;
  const barW = (w - padding*2 - gap*(values.length-1)) / values.length;
  ctx.font = '10px Vazirmatn, Tahoma, sans-serif';
  ctx.textAlign = 'center';
  values.forEach((v,i)=>{
    const barH = max ? (v/max)*chartH : 0;
    const x = padding + i*(barW+gap);
    const y = chartH - barH + 14;
    ctx.fillStyle = color;
    roundRectFill(ctx, x, y, barW, barH, 6);
    ctx.fillStyle = '#0F1B2D';
    ctx.fillText(String(v), x+barW/2, y-6);
    ctx.fillStyle = '#6B7686';
    ctx.fillText(labels[i], x+barW/2, chartH+30);
  });
}
function drawLineChart(id, labels, values, color){
  const {ctx,w,h} = setupCanvas(id, 150);
  const max = Math.max(...values, 1);
  const padding = 12, bottomPad = 26;
  const chartH = h - bottomPad - 14;
  const stepX = (w - padding*2) / (values.length-1 || 1);
  const pts = values.map((v,i)=> ({x: padding+i*stepX, y: chartH - (max?(v/max)*chartH:0) + 10}));
  const grad = ctx.createLinearGradient(0,10,0,chartH+10);
  grad.addColorStop(0,'rgba(201,162,39,.35)');
  grad.addColorStop(1,'rgba(201,162,39,0)');
  ctx.beginPath();
  ctx.moveTo(pts[0].x, chartH+10);
  pts.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.lineTo(pts[pts.length-1].x, chartH+10);
  ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();
  ctx.beginPath();
  pts.forEach((p,i)=> i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.strokeStyle = color; ctx.lineWidth = 2.4; ctx.lineJoin='round'; ctx.stroke();
  ctx.font = '11px Vazirmatn, Tahoma, sans-serif';
  ctx.textAlign = 'center';
  pts.forEach((p,i)=>{
    ctx.beginPath(); ctx.arc(p.x,p.y,3.4,0,Math.PI*2);
    ctx.fillStyle = '#0F1B2D'; ctx.fill();
    ctx.fillStyle = '#6B7686';
    ctx.fillText(labels[i], p.x, chartH+30);
  });
}

// ================= BACKUP =================
function renderBackup(){
  main.innerHTML = `
    <div class="backup-card">
      <h4>خروجی گرفتن از اطلاعات</h4>
      <p>یک فایل پشتیبان از تمام مشتریان، سفارش‌ها، نصب‌ها، فاکتورها و پاسخ‌های آماده دانلود کن. این فایل را جای امنی نگه دار.</p>
      <button class="btn btn-primary" id="exportBtn" style="width:100%;">دریافت فایل پشتیبان</button>
    </div>
    <div class="backup-card">
      <h4>بازیابی از فایل پشتیبان</h4>
      <p>با انتخاب یک فایل پشتیبان معتبر، اطلاعات فعلی این دستگاه با اطلاعات فایل جایگزین می‌شود.</p>
      <label class="file-input-label" for="importFile">برای انتخاب فایل ضربه بزن</label>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
    </div>
    <div class="backup-card">
      <h4>پاک کردن همه اطلاعات</h4>
      <p>تمام مشتریان، سفارش‌ها، نصب‌ها و فاکتورها برای همیشه حذف می‌شوند. پیش از این کار حتماً فایل پشتیبان بگیر.</p>
      <button class="btn btn-danger" id="resetBtn" style="width:100%;">پاک کردن همه اطلاعات</button>
    </div>
  `;
  document.getElementById('exportBtn').addEventListener('click', exportBackup);
  document.getElementById('importFile').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(file) importBackup(file);
  });
  document.getElementById('resetBtn').addEventListener('click', async ()=>{
    if(confirm('مطمئنی می‌خوای همه اطلاعات پاک بشه؟ این کار قابل بازگشت نیست.')){
      data = emptyData();
      await saveData(); render();
    }
  });
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'ojwin-upvc-backup-' + todayISO() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function importBackup(file){
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed || typeof parsed !== 'object') throw new Error('invalid');
      if(!confirm('اطلاعات فعلی این دستگاه با محتوای فایل جایگزین می‌شود. ادامه می‌دهی؟')) return;
      data = Object.assign(emptyData(), parsed);
      await saveData(); render();
      alert('بازیابی با موفقیت انجام شد.');
    }catch(err){
      alert('فایل انتخاب‌شده معتبر نیست.');
    }
  };
  reader.readAsText(file);
}
